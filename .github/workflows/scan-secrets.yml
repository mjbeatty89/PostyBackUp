name: Scan for Secrets in Collections

on:
  push:
    paths:
      - 'collections/**/*.json'
  pull_request:
    paths:
      - 'collections/**/*.json'

jobs:
  scan-secrets:
    name: Detect API Keys and Secrets
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Scan collection files for secrets
        id: scan
        run: |
          echo "Scanning Postman collections for potential secrets..."
          
          # Define patterns to search for
          PATTERNS=(
            "\"(api[_-]?key|apikey)\"\s*:\s*\"[^{][^\"]{8,}\""
            "\"(secret|password|passwd|pwd)\"\s*:\s*\"[^{][^\"]{8,}\""
            "\"(token|auth[_-]?token)\"\s*:\s*\"[^{][^\"]{8,}\""
            "\"(authorization|auth)\"\s*:\s*\"Bearer [^{][^\"]{8,}\""
            "\"value\"\s*:\s*\"(sk-[a-zA-Z0-9]{32,}|xox[baprs]-[a-zA-Z0-9-]{10,})\""
            "\"(aws[_-]?access[_-]?key[_-]?id|aws[_-]?secret[_-]?access[_-]?key)\"\s*:\s*\"[^{][^\"]{8,}\""
            "\"(private[_-]?key|client[_-]?secret)\"\s*:\s*\"[^{][^\"]{8,}\""
          )
          
          found_secrets=0
          findings_file="secret_findings.txt"
          > "$findings_file"
          
          # Search for patterns in collection files
          for pattern in "${PATTERNS[@]}"; do
            while IFS= read -r file; do
              if grep -iP "$pattern" "$file" > /dev/null 2>&1; then
                echo "⚠️ Potential secret found in: $file"
                echo "File: $file" >> "$findings_file"
                grep -inP "$pattern" "$file" | head -5 >> "$findings_file"
                echo "---" >> "$findings_file"
                found_secrets=$((found_secrets + 1))
              fi
            done < <(find collections -name "*.json" -type f)
          done
          
          # Check for common API key patterns that aren't variables
          echo "Checking for hardcoded values (not using variables)..."
          while IFS= read -r file; do
            # Look for authorization headers without variables
            if grep -iE '"(authorization|x-api-key|api-key)"\s*:\s*"[^{]' "$file" > /dev/null 2>&1; then
              # Exclude common safe values
              if ! grep -iE '"(authorization|x-api-key|api-key)"\s*:\s*"(Bearer {{|{{|Basic {{)"' "$file" > /dev/null 2>&1; then
                echo "⚠️ Potential hardcoded authorization in: $file"
                echo "File: $file - Hardcoded authorization detected" >> "$findings_file"
                grep -inE '"(authorization|x-api-key|api-key)"\s*:\s*"[^{]' "$file" | head -3 >> "$findings_file"
                echo "---" >> "$findings_file"
                found_secrets=$((found_secrets + 1))
              fi
            fi
          done < <(find collections -name "*.json" -type f)
          
          if [ $found_secrets -gt 0 ]; then
            echo "scan_result=FOUND" >> $GITHUB_OUTPUT
            echo "found_count=$found_secrets" >> $GITHUB_OUTPUT
          else
            echo "scan_result=CLEAN" >> $GITHUB_OUTPUT
            echo "found_count=0" >> $GITHUB_OUTPUT
            echo "✅ No hardcoded secrets detected in collections"
          fi
      
      - name: Upload findings
        if: steps.scan.outputs.scan_result == 'FOUND'
        uses: actions/upload-artifact@v3
        with:
          name: secret-findings
          path: secret_findings.txt
          retention-days: 30
      
      - name: Comment on findings
        if: steps.scan.outputs.scan_result == 'FOUND'
        run: |
          echo "::warning::🔐 Potential secrets detected in Postman collections!"
          echo "::warning::Found ${{ steps.scan.outputs.found_count }} potential issue(s)"
          echo ""
          echo "Please review the findings and take action:"
          echo "1. Replace hardcoded secrets with variables like {{api_key}}"
          echo "2. Store actual secrets in GitHub Secrets (Settings → Secrets)"
          echo "3. Use Postman environments to manage sensitive values"
          echo ""
          cat secret_findings.txt || true
      
      - name: Create security alert
        if: steps.scan.outputs.scan_result == 'FOUND' && github.event_name == 'push'
        run: |
          echo "::error::Security Alert: Potential secrets found in Postman collections"
          echo "::error::Action required: Review and sanitize the collections before deployment"
          echo "::error::Check the 'secret-findings' artifact for details"
          exit 1
      
      - name: Success message
        if: steps.scan.outputs.scan_result == 'CLEAN'
        run: |
          echo "::notice::✅ All collections are clean - no hardcoded secrets detected"
          echo "Collections are using variables properly for sensitive data"
